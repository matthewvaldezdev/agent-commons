name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
        env:
          AGENT_COMMONS_AUTOSTART: '0'
      - name: CLI smoke test
        shell: bash
        run: |
          node bin/agent-commons.mjs --help
          node bin/agent-commons.mjs connect "CI Agent" --client generic --data-dir "$RUNNER_TEMP/commons-ci" --port 4390
          node bin/agent-commons.mjs agents --data-dir "$RUNNER_TEMP/commons-ci" --port 4390
